name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        outputs:
            created: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - id: release
              uses: googleapis/release-please-action@v5.0.0

    publish:
        name: Publish firmware
        runs-on: ubuntu-latest
        needs: release
        if: needs.release.outputs.created == 'true'
        environment: firmware
        env:
            TAG: ${{ needs.release.outputs.tag }}
            FIRMWARE_NAME: garduino-firmware-${{ needs.release.outputs.version }}.bin
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Verify release tag
              run: test "$(git describe --tags --exact-match)" = "$TAG"

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - uses: actions/cache@v6
              with:
                  path: ~/.platformio
                  key: platformio-${{ hashFiles('platformio.ini') }}

            - name: Install PlatformIO
              run: pip install platformio

            - name: Build
              run: |
                  pio run -e nodemcuv2
                  cp .pio/build/nodemcuv2/firmware.bin "$FIRMWARE_NAME"

            - uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Upload to S3
              run: >-
                  aws s3api put-object
                  --bucket "$FIRMWARE_BUCKET"
                  --key "$FIRMWARE_NAME"
                  --body "$FIRMWARE_NAME"
                  --if-none-match "*"
              env:
                  FIRMWARE_BUCKET: ${{ vars.FIRMWARE_BUCKET }}

            - name: Attach to GitHub release
              run: gh release upload "$TAG" "$FIRMWARE_NAME"
              env:
                  GH_TOKEN: ${{ github.token }}
